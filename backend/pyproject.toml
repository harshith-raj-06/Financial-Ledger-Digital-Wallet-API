[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-ledger-backend"
version = "0.0.1"
description = "Financial Ledger API component"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*", "db"]

[tool.setuptools.package-data]
db = ["migrations/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100
